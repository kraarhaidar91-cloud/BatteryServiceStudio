name: Build Windows 7 Compatible Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore .NET Framework reference assemblies
        run: msbuild BatteryServiceStudio.csproj /t:Restore /p:Configuration=Release /p:Platform=x86

      - name: Build application
        run: msbuild BatteryServiceStudio.csproj /p:Configuration=Release /p:Platform=x86 /m

      - name: Verify executable
        shell: powershell
        run: |
          if (!(Test-Path "bin\Release\BatteryServiceStudio.exe")) {
            Write-Error "Application executable was not created."
            exit 1
          }

      - name: Prepare publish directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item "bin\Release\BatteryServiceStudio.exe" "publish\BatteryServiceStudio.exe"
          Copy-Item "app.manifest" "publish\app.manifest"

      - name: Download legacy Inno Setup 5.6.1 Unicode
        shell: powershell
        run: |
          Invoke-WebRequest "https://files.jrsoftware.org/is/5/innosetup-5.6.1-unicode.exe" -OutFile "${env:RUNNER_TEMP}\innosetup.exe"
          Start-Process "${env:RUNNER_TEMP}\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe" "installer.iss"
          if (!(Test-Path "installer\BatteryServiceStudio_Setup_Win7.exe")) {
            Write-Error "Installer was not created."
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BatteryServiceStudio-Windows7-Installer
          path: installer/BatteryServiceStudio_Setup_Win7.exe
