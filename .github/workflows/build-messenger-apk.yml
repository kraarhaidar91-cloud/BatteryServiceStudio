name: Build Messenger Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MessengerSmartArchiveAndroid/**'
      - '.github/workflows/build-messenger-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: MessengerSmartArchiveAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessengerSmartArchive-debug-apk
          path: MessengerSmartArchiveAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: Messenger Smart Archive for Android
          body: |
            ملف APK تجريبي لتطبيق أرشيف ماسنجر الذكي.
            التثبيت يتطلب السماح بتثبيت التطبيقات من مصدر التنزيل عند مطالبة أندرويد بذلك.
          make_latest: true
          files: MessengerSmartArchiveAndroid/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
